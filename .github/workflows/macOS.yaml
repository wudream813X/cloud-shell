name: macos cloud-shell

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    
    steps:
      - name: Install cloudflared
        run: brew install cloudflared
      
      - name: Enable SSH Service
        run: |
          sudo systemsetup -setremotelogin on
          sudo systemsetup -getremotelogin
      - name: Change Hostname
        run: |
          NEW_NAME="macOS-cloud-shell"
          sudo scutil --set HostName $NEW_NAME
          sudo scutil --set ComputerName $NEW_NAME
          sudo scutil --set LocalHostName $NEW_NAME
      
      - name: Create New User
        run: sudo sysadminctl -addUser dream -fullName dream -password dream -admin
      
      - name: Run cloudflared
        run: cloudflared tunnel --url ssh://localhost:22
