name: macos cloud-shell

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    
    steps:
      - name: Install cloudflared
        run: brew install cloudflared
      
      - name: Enable SSH Service
        run: |
          sudo systemsetup -setremotelogin on
          sudo systemsetup -getremotelogin
      
      - name: Create New User (remote_admin)
        run: |
          USERNAME="remote_admin"
          PASSWORD="MyPassword@123456"
          sudo dscl . -create /Users/$USERNAME
          sudo dscl . -create /Users/$USERNAME UserShell /bin/zsh
          sudo dscl . -create /Users/$USERNAME RealName "Remote Admin"
          sudo dscl . -create /Users/$USERNAME UniqueID 501
          sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
          sudo dscl . -passwd /Users/$USERNAME "$PASSWORD"
          sudo dscl . -append /Groups/admin GroupMembership $USERNAME
          sudo createhomedir -c -u $USERNAME
          echo "User $USERNAME created successfully."
      
      - name: Run cloudflared
        run: cloudflared tunnel --url ssh://localhost:22
