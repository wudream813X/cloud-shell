name: windows cloud-shell

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    
    steps:
      - name: Setup cloudflared
        run: |
          Invoke-WebRequest -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
      
      - name: Setup SSH Server
        run: |
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          Get-Service sshd

      - name: Disable Password Policy
        shell: cmd
        run: |
          secedit /export /cfg c:\secpol.cfg
          (Get-Content c:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0" | Set-Content c:\secpol.cfg
          secedit /configure /db c:\windows\security\local.sdb /cfg c:\secpol.cfg /areas SECURITYPOLICY
          
      - name: Change Hostname (Spoofing)
        run: |
          $NewName = "dream-windows-shell"
          $env:COMPUTERNAME = $NewName
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName" -Name "ComputerName" -Value $NewName
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName" -Name "ComputerName" -Value $NewName
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "Hostname" -Value $NewName
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "NV Hostname" -Value $NewName
      
      - name: Create New User
        shell: cmd
        run: |
          net user dream dream /add /y
          net localgroup administrators dream /add
      
      - name: Run cloudflared
        run: |
          .\cloudflared.exe tunnel --url ssh://localhost:22
