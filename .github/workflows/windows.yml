name: windows cloud-shell

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    
    steps:
      - name: Setup cloudflared
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile "cloudflared.exe"
      
          .\cloudflared.exe --version
      
      - name: Setup SSH Server
        shell: pwsh
        run: |
          Start-Service sshd
          Set-Service -Name sshd -StartupType Automatic
          Get-Service sshd
      
      - name: Disable Password Policy
        run: |
          secedit /export /cfg c:\secpol.cfg
          (Get-Content c:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0" | Set-Content c:\secpol.cfg
          secedit /configure /db c:\windows\security\local.sdb /cfg c:\secpol.cfg /areas SECURITYPOLICY
        
      - name: Create New User
        shell: pwsh
        run: |
          net user dream dream /add
          net localgroup administrators dream /add
      
      - name: Test Network
        shell: pwsh
        run: |
          Write-Host "=== DNS ==="
          Resolve-DnsName api.trycloudflare.com
      
          Write-Host "=== DNS 1.1.1.1 ==="
          Resolve-DnsName api.trycloudflare.com -Server 1.1.1.1
      
          Write-Host "=== TCP ==="
          Test-NetConnection api.trycloudflare.com -Port 443
      
      - name: Run cloudflared
        shell: cmd
        run: |
          .\cloudflared.exe tunnel --url ssh://localhost:22
