name: windows cloud-shell

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    
    steps:
      - name: Setup cloudflared
        run: |
          Invoke-WebRequest -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
      
      - name: Setup SSH Server
        run: |
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          Get-Service sshd

      - name: Disable Password Policy
        run: |
          secedit /export /cfg c:\secpol.cfg
          (Get-Content c:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0" | Set-Content c:\secpol.cfg
      
      - name: Create New User
        run: |
          net user dream dream /add /y
          net localgroup administrators $NewUser /add
      
      - name: Run cloudflared
        run: |
          .\cloudflared.exe tunnel --url ssh://localhost:22
